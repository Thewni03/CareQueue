server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smarthealth}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-at-least-32-bytes}
app.jwt.expiry-hours=24
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Claude API (leave blank to use the built-in fallback matcher)
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

# Push notifications trigger when this many patients (or fewer) are ahead
app.queue.notify-ahead=5
# Minutes after creation that queue tokens / phone numbers are scrubbed (MongoDB TTL)
app.queue.ttl-hours=12

# Firebase Cloud Messaging: path to service-account JSON (leave blank to only log notifications)
app.fcm.credentials=${FIREBASE_CREDENTIALS:}
